object = "port_range"
name = "REVOKE"
number = 1
blank_line_before = false
rights = ["GRANT"]
refusals = []
arguments = []
answers = []
doc = '''
`invoke(capability, REVOKE, _, _, _)` -> 0. **Take the ports back from everyone else.** Delete every
`PortRange` capability naming this range from every other thread's table and clear the TSS
bitmap that granted it, so those holders fault on their next `in`/`out`, while the caller
keeps its own. Needs `GRANT` (you were trusted to lend the ports on, so you may take them
back), the same rule and the same asymmetry `DeviceFrame`'s take-back uses: the kernel mints
a port capability once, at boot, so a symmetric revoke would strand the device forever.
'''

[[method]]
object = "reboot"
name = "REBOOT"
number = 0
blank_line_before = false
returns = "refusal"
rights = []
refusals = ["NoResetMechanism", "ResetNotSupported", "ResetDenied", "ResetDidNotHappen"]
arguments = []
answers = []
doc = '''
`invoke(capability, REBOOT, _, _, _)`. **On success it does not return**: the kernel asks the firmware
for a cold reset (PSCI `SYSTEM_RESET` on aarch64, the SBI's system reset (SRST) extension,
type 1, on riscv64, and on `x86_64` the reset register that the firmware's Advanced
Configuration and Power Interface (ACPI) tables describe, then port `0xCF9`, then the 8042). When every route was refused it
returns the reason, one of the four `Reset…` values of [`crate::Error`], and the firmware's raw
code is on the kernel console just before.

**It syncs nothing**: a caller with a writable filesystem asks it to sync
and waits for the reply first. A firmware that accepts the call and hangs looks the same as a
slow reset from inside the machine.
'''

