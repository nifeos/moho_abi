doc = '''
`invoke(capability, CONFIGURE, entry, user_sp, address_space_slot)` -> the thread's current-CPU page
address, never negative (zero if none could be given). Bind the space in `address_space_slot`
and set the EL0 entry and user stack of an embryo TCB. Needs `WRITE` on both capabilities.
Semantics follow the thread system calls as built.

- **The capability is consumed; the space's name is not**. A space that already has a holder is refused with `WrongObject`.
- **A process capability with [`rights::BIND`](super::rights::BIND)** instead joins that process,
  unconsumed; `OutOfMemory` when it already has as many threads as a current-CPU page admits.
- Word 5 (the sixth) is the first thread pointer: zero or a user address, else `BadPointer`.
'''

[[method]]
object = "thread_control_block"
name = "CAPABILITY_INSERT"
number = 1
rights = ["WRITE"]
refusals = ["OutOfMemory", "NoSuchSlot", "WrongObject", "NotPermitted"]
arguments = [
    { name = "capability_slot", bits = "u64::MAX" },
    { name = "rights", bits = "rights::ALL" },
    { name = "target", bits = "u64::MAX" },
]
answers = ["child_slot"]
doc = '''
`invoke(capability, CAPABILITY_INSERT, capability_slot, rights, target)` -> `child_slot`. Copy the capability in
the caller's `capability_slot`, narrowed to `rights`, into the child's capability table, returning the slot
it landed in. The child's whole initial authority is built this way, one grant at a time,
before it runs. Needs `WRITE` on the TCB cap and `GRANT` on the inserted capability.

`target` chooses where the capability lands: **0 places it in the first free slot** (the
original behavior, so every existing caller is unchanged), and `n` places it in slot
`n - 1`. The explicit target exists for the supervision rendezvous, which a supervisor puts
in the reserved [`fault::FAULT_RENDEZVOUS_SLOT`](super::fault::FAULT_RENDEZVOUS_SLOT) rather than wherever
first-free happened to fall. `OutOfMemory` if the chosen slot is occupied or out of range.
'''

[[method]]
object = "thread_control_block"
name = "START"
number = 2
rights = ["WRITE"]
refusals = ["NoSuchSlot", "WrongObject", "NotPermitted", "OutOfMemory", "Gone"]
arguments = [
    { name = "argument_0", bits = "u64::MAX" },
    { name = "argument_1", bits = "u64::MAX" },
    { name = "argument_2", bits = "u64::MAX" },
]
answers = []
doc = '''
`invoke(capability, START, x0, x1, x2)` -> 0. Make the thread runnable: it gets a kernel stack and
an entry context and joins the run queue. **The three arguments are the child's first
`x0`, `x1` and `x2`** (`a0` to `a2` on RISC-V, `rdi`, `rsi` and `rdx` on `x86_64`), passed
through unconditionally, which is how a builder hands a worker its input. A caller with nothing to pass sends
zeros. **Refuses a half-built thread** (no bound address space, or no entry): a TCB must be
whole before it runs. Needs `WRITE`.
'''

[[method]]
object = "thread_control_block"
name = "SET_THREAD_POINTER"
number = 3
rights = ["WRITE"]
refusals = ["WrongObject", "BadPointer", "NoSuchSlot"]
arguments = [
    { name = "value", bits = "u64::MAX" },
]
answers = []
doc = '''
`invoke(capability, SET_THREAD_POINTER, value, _, _)` -> 0 (seL4's `SetTLSBase`). **Change the thread pointer of the thread this TCB
names**: `TPIDR_EL0` on aarch64, `tp` on riscv64, the `FS` base on `x86_64`. Needs `WRITE`.

- The target is an embryo, which takes the value when it first runs, or the caller, which takes
  it before this returns; any other started thread is `WrongObject`.
- `value` is zero or a user address, else `BadPointer` and nothing changes. The kernel keeps it
  per thread; a program writing its own register is outside this contract.

*(Name and number provisional.)*
'''

[[method]]
object = "thread_control_block"
name = "SUSPEND"
number = 4
rights = ["WRITE"]
refusals = ["WrongObject", "Gone", "NoSuchSlot"]
arguments = []
answers = []
doc = '''
`invoke(capability, SUSPEND, _, _, _)` -> 0 (seL4's `TCB_Suspend`). **Stop the thread this TCB names until a [`RESUME`]**, keeping its
registers. Needs `WRITE`: the TCB capability is the whole authority.

- **Silent**: nothing reaches the supervision rendezvous that reports deaths.
- **Stopped when it returns**, even when the thread was running on another core.
- A thread blocked in IPC stays in it, and stops before its next user instruction once it ends.
- A thread may suspend itself; the call returns 0 once somebody resumes it. Suspending a
  suspended thread is 0; an embryo is `WrongObject`. A thread that has exited, died or been doomed
  by a `DESTROY`, and is not yet reaped, is `Gone`; once it is reaped, the capability is `NoSuchSlot`.
'''

[[method]]
object = "thread_control_block"
name = "RESUME"
number = 5
rights = ["WRITE"]
refusals = ["WrongObject", "Gone", "NoSuchSlot"]
arguments = []
answers = []
doc = '''
`invoke(capability, RESUME, _, _, _)` -> 0 (seL4's `TCB_Resume`). **Let a suspended
thread run on from where it stopped**: the saved program counter, every register as it was. Not a re-run.
Needs `WRITE`.

Resuming a thread that is not suspended is 0 and changes nothing. An embryo is `WrongObject`; a thread that
has exited, died or been doomed by a `DESTROY`, and is not yet reaped, is `Gone`; once it is reaped, the
capability is `NoSuchSlot`.
'''

