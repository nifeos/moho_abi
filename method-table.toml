object = "thread_control_block"
name = "CONFIGURE"
number = 0
blank_line_before = false
rights = ["WRITE"]
refusals = ["WrongObject", "OutOfMemory", "BadPointer", "NoSuchSlot", "NotPermitted", "Gone"]
